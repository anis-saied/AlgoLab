<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Storage</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/user-inscription.js"></script>
</head>

<body onload="init()">
    <div class="container">
        <form>
            <fieldset>
                <legend>Inscription</legend>
                <div class="form-line">
                    <label for="firstName">Nom</label>
                    <input type="text" name="firstName" id="firstName" size="25" placeholder="Nom" required>
                </div>
                <div class="form-line">
                    <label for="lastName">Prénom</label>
                    <input type="text" name="lastName" id="lastName" size="25" placeholder="Prénom" required>
                </div>
                <div class="form-line">
                    <label for="address">Adresse</label>
                    <input type="text" name="address" id="address" size="25" placeholder="Adresse" required>
                </div>
                <div class="form-line">
                    <label for="city">Ville</label>
                    <input type="text" name="city" id="city" size="25" placeholder="Ville" required>
                </div>
            </fieldset>
        </form>
        <section>
            <a href="./user-order-distination.html">Suite</a> de votre commande.
        </section>
    </div>
</body>

</html>
